<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice RAG — HH Goa 2026</title>
<meta name="description" content="A voice-enabled RAG pipeline built for the HH Goa 2026 shortlisting task." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2305070a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%2339ff88' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body.land-body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #rain {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
  }
  .land-wrap {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    cursor: pointer;
  }
  .land-logo {
    font-family: var(--mono);
    text-align: center;
    margin-bottom: 2rem;
    animation: land-in 0.6s ease both;
  }
  .land-logo .glyph {
    font-size: 2.4rem;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(57,255,136,0.55);
  }
  .land-logo h1 {
    font-size: clamp(2rem, 7vw, 3.4rem);
    margin: 0.3rem 0 0.2rem;
    letter-spacing: 0.04em;
    color: var(--text);
    text-shadow: 0 0 24px rgba(57,255,136,0.25);
  }
  .land-logo .flicker { animation: land-flicker 4.5s infinite; }
  .land-tag {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--accent-2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .land-term {
    width: min(560px, 92vw);
    background: rgba(13,17,23,0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.3rem 1.5rem;
    font-family: var(--mono);
    font-size: 0.82rem;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 40px rgba(57,255,136,0.06);
    animation: land-in 0.6s ease 0.15s both;
  }
  .land-line {
    display: flex;
    gap: 0.5rem;
    color: var(--text-dim);
    min-height: 1.4em;
    opacity: 0;
  }
  .land-line.shown { opacity: 1; }
  .land-line .ok { color: var(--accent); margin-left: auto; opacity: 0; white-space: nowrap; }
  .land-line.done .ok { opacity: 1; }
  .land-prompt { color: var(--accent-2); flex-shrink: 0; }

  .land-bar-track {
    height: 4px;
    background: var(--bg-elevated);
    border-radius: 2px;
    overflow: hidden;
    margin: 1rem 0 0.6rem;
  }
  .land-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.25s linear;
  }
  .land-pct {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: right;
  }

  .land-enter {
    margin-top: 1.6rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.08em;
    opacity: 0;
    text-align: center;
  }
  .land-enter.show {
    opacity: 1;
    animation: land-pulse 1.6s ease-in-out infinite;
  }
  .land-skip {
    position: fixed;
    bottom: 1rem;
    right: 1.2rem;
    z-index: 3;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-dim);
    opacity: 0.7;
  }
  .land-fadeout { animation: land-fadeout 0.4s ease forwards; }

  @keyframes land-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes land-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes land-fadeout { to { opacity: 0; } }
  @keyframes land-flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.4; }
    94% { opacity: 1; }
    95% { opacity: 0.3; }
    96% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .land-logo, .land-term { animation: none; opacity: 1; }
    .land-line { transition: none; }
  }
</style>
</head>
<body class="land-body">
  <canvas id="rain" aria-hidden="true"></canvas>

  <div class="land-wrap" id="landWrap">
    <div class="land-logo">
      <div class="glyph">&gt;_</div>
      <h1>VOICE<span class="flicker">RAG</span></h1>
      <div class="land-tag">HH Goa 2026 · Shortlisting Task 2</div>
    </div>

    <div class="land-term" role="status" aria-live="polite">
      <div class="land-line" data-line><span class="land-prompt">$</span><span class="txt"></span><span class="ok">OK</span></div>
      <div class="land-line" data-line><span class="land-prompt">$</span><span class="txt"></span><span class="ok">OK</span></div>
      <div class="land-line" data-line><span class="land-prompt">$</span><span class="txt"></span><span class="ok">OK</span></div>
      <div class="land-line" data-line><span class="land-prompt">$</span><span class="txt"></span><span class="ok">OK</span></div>
      <div class="land-line" data-line><span class="land-prompt">$</span><span class="txt"></span><span class="ok">READY</span></div>
      <div class="land-bar-track"><div class="land-bar-fill" id="landBarFill"></div></div>
      <div class="land-pct" id="landPct">0%</div>
    </div>

    <div class="land-enter" id="landEnter">[ press any key / click / tap to enter ]</div>
  </div>

  <div class="land-skip" id="landSkip">skip →</div>

  <script>
    const BOOT_LINES = [
      "loading FAISS index [12,278 chunks]",
      "connecting STT provider [elevenlabs]",
      "guardrails: safety / offtopic / grounding",
      "harness: retries + structured I/O",
      "retrieval budget: <200ms",
    ];

    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");
    let cols, drops;
    const GLYPHS = "01देवनागरीहवायोगभारतमांसपेशियां".split("");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cols = Math.floor(canvas.width / 18);
      drops = new Array(cols).fill(0).map(() => Math.random() * -50);
    }
    resize();
    window.addEventListener("resize", resize);

    function drawRain() {
      ctx.fillStyle = "rgba(5,7,10,0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "15px monospace";
      for (let i = 0; i < cols; i++) {
        const g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        const x = i * 18;
        const y = drops[i] * 18;
        ctx.fillStyle = Math.random() > 0.96 ? "#e6edf3" : "rgba(57,255,136,0.55)";
        ctx.fillText(g, x, y);
        if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    let rainTimer = setInterval(drawRain, 55);

    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const lines = document.querySelectorAll(".land-line");
    const fill = document.getElementById("landBarFill");
    const pct = document.getElementById("landPct");
    const enterEl = document.getElementById("landEnter");
    let redirected = false;

    function goToApp() {
      if (redirected) return;
      redirected = true;
      clearInterval(rainTimer);
      document.getElementById("landWrap").classList.add("land-fadeout");
      setTimeout(() => { window.location.href = "app.html"; }, 380);
    }

    function typeLine(el, text, cb) {
      const txtEl = el.querySelector(".txt");
      el.classList.add("shown");
      if (prefersReduced) { txtEl.textContent = text; el.classList.add("done"); cb(); return; }
      let i = 0;
      const speed = 14;
      const tick = () => {
        txtEl.textContent = text.slice(0, i);
        i++;
        if (i <= text.length) {
          setTimeout(tick, speed);
        } else {
          el.classList.add("done");
          cb();
        }
      };
      tick();
    }

    function runBoot(index) {
      if (index >= lines.length) {
        pct.textContent = "100%";
        fill.style.width = "100%";
        enterEl.classList.add("show");
        setTimeout(goToApp, 1400);
        return;
      }
      typeLine(lines[index], BOOT_LINES[index], () => {
        const p = Math.round(((index + 1) / lines.length) * 100);
        fill.style.width = p + "%";
        pct.textContent = p + "%";
        setTimeout(() => runBoot(index + 1), 90);
      });
    }
    runBoot(0);

    window.addEventListener("keydown", goToApp);
    window.addEventListener("click", goToApp);
    window.addEventListener("touchstart", goToApp, { passive: true });
    document.getElementById("landSkip").addEventListener("click", (e) => { e.stopPropagation(); goToApp(); });
  </script>
</body>
</html>
